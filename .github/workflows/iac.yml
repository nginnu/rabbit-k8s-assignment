name: iac

on:
  pull_request:
    paths: ["gcp/**", ".github/workflows/iac.yml"]
  push:
    branches: [main, master]
    paths: ["gcp/**", ".github/workflows/iac.yml"]

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TERRAFORM_VERSION: "1.9.8"
  CHECKOV_VERSION: "3.3.12"
  TRIVY_VERSION: "0.74.0"

jobs:
  # gcp/ currently holds .gitkeep files and nothing else. Run without this and
  # every job below reports green: `terraform validate` succeeds on an empty
  # directory, and checkov exits 0 having scanned nothing and written no report.
  # Three green checks that prove no Terraform was ever looked at is worse than
  # no checks at all.
  discover:
    name: discover · terraform present
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      present: ${{ steps.find.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: find
        run: |
          count=$(find gcp -name '*.tf' -type f | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### iac · $count .tf files found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### iac · skipped"
              echo "\`gcp/\` contains no \`.tf\` files. terraform, checkov and trivy"
              echo "did not run — nothing was scanned and nothing is claimed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform:
    name: terraform · fmt + validate
    needs: discover
    if: needs.discover.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper rewrites stdout to feed step outputs, which turns a
          # plain `terraform fmt -check` diff into unreadable noise.
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive gcp/

      # -backend=false: validate needs the providers, not the state. Configuring
      # a real backend here would have CI authenticate to GCS just to check
      # syntax, and give the job credentials it has no reason to hold.
      - name: init
        working-directory: gcp/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: gcp/environments/${{ matrix.environment }}
        run: terraform validate -no-color

  checkov:
    name: iac scan · checkov
    needs: discover
    if: needs.discover.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "checkov==${CHECKOV_VERSION}"

      # --soft-fail is deliberately absent. A scanner that cannot fail the build
      # is a report, and reports on a green pipeline do not get read.
      - name: checkov
        run: |
          checkov \
            --directory gcp/ \
            --framework terraform \
            --output sarif --output-file-path . \
            --compact --quiet

      # checkov exits 0 and writes nothing when it finds no resources, so the
      # upload has to ask whether the file exists rather than assume the step
      # before it produced one.
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14

  # Second opinion on the same files. tfsec is not used: its own README says
  # engineering attention has moved to Trivy and points the community there
  # (https://github.com/aquasecurity/tfsec#-tfsec-to-trivy-migration), so
  # `trivy config` is tfsec's scanning engine with the maintenance behind it.
  trivy-config:
    name: iac scan · trivy
    needs: discover
    if: needs.discover.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: trivy config
        run: |
          trivy config gcp/ \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output trivy-iac.sarif
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-config
