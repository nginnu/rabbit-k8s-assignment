# PERMISSIVE (the mesh default) already negotiates mTLS between two sidecars, so
# this changes nothing on the wire today. It survives an istiod upgrade that
# moves that default instead of depending on one.
#
# Client-side only. The server side stays PERMISSIVE because Traefik is not in
# the mesh and its plaintext HTTP must keep being accepted — a PeerAuthentication
# STRICT here would cut every edge route at once.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: east-west-mtls
  namespace: api
spec:
  host: "*.api.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
