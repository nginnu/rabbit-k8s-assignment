# Client-side declarations of east-west mTLS, one per namespace with meshed
# services. Both rules only pin what sidecars already do (auto-mTLS covers a
# caller with no matching rule; PERMISSIVE accepts mTLS), so the wire does not
# change — the declaration survives a default changing, which is the point.
#
# With mesh-wide STRICT (peer-authentication.yaml) these are also what keeps
# every named caller on mTLS explicitly rather than by fallback: web-ui
# (ns web) calls *.api, and istio-ingressgateway (ns istio-system) calls both
# *.web (the storefront) and *.api (order's canary route) — hence exportTo
# "*", visible outside the rule's own namespace.
#
# Deliberately NOT a mesh-wide host such as "*.local": the data tier (mariadb,
# redis) has no sidecars, and ISTIO_MUTUAL towards them would break
# order->mariadb at once. Scope stays per namespace.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: east-west-mtls
  namespace: api
spec:
  host: "*.api.svc.cluster.local"
  exportTo:
    - "*"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: east-west-mtls
  namespace: web
spec:
  host: "*.web.svc.cluster.local"
  exportTo:
    - "*"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
