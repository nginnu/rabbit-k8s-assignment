# Default-deny over the gateway namespace, with the traefik policy that has to
# come with it. Applying the deny alone takes the ingress offline: nothing in
# this namespace had a policy before, so every pod here was unisolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 8000/8443 are the container ports behind hostPort 80/443. Traffic arrives
    # from off-cluster, so there is no pod or namespace to select — an ipBlock
    # is the only peer that matches it, and this is the one workload in the
    # cluster where that is the point.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Traefik watches Gateway and HTTPRoute objects. Cut this and every route
    # stops updating, while the pod stays Running and the last-known config
    # keeps serving — the failure appears as a route that never takes effect.
    # Every namespace this gateway has an HTTPRoute into.
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [web, api, argocd, observability, kube-system]
