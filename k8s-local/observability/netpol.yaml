apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kiali-apiserver
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kiali
  egress:
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
