# A dedicated hostname, not a path under the storefront: the console serves its
# UI and its own /api from /, which under localhost would collide with the
# web-ui and api routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: observability
spec:
  hostnames:
    - kiali.localhost
  parentRefs:
    - name: external
      namespace: gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: kiali
          port: 20001
