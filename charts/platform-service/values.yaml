# platform-service — values schema
#
# A service is one entry under `services.<name>`. The library loops over that
# map, so adding a service means adding values, not editing a template.

# Required, and deliberately left unset here. Every template reads it through
# the `platform-service.namespace` helper, which fails the render when it is
# missing — a default would let a chart that forgot the key install a healthy
# release into the wrong namespace and be found only by going looking for it.
namespace: ""

sharedConfig: {}
sharedSecret: {}

services: {}
# Example — copy this shape for each service:
#   my-service:
#     image:
#       repository: my-service
#       tag: v0.1.0
#       pullPolicy: Never           # local: kind load, no registry to pull from
#     port: 8080                    # container port; the Service listens on 80
#     replicas: 2
#     workloadKind: Deployment      # Rollout switches this service to canary
#     uid: 10001                    # numeric — kubelet does not resolve names
#     readOnlyRootFilesystem: true  # false only where the runtime writes to its
#                                   # own image at run time
#     probes:                       # initialDelaySeconds: 0 is honoured, not
#                                   # replaced by the default — state it to mean it
#       liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
#       readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }
#     resources:
#       requests: { cpu: 50m, memory: 96Mi }
#       limits:   { cpu: 500m, memory: 384Mi }
#     env:
#       - { name: APP_PORT, value: "8080" }
#     envFromSecret:                # names only, never values
#       - some-credential
#     topologySpread: true
#     pdb: { minAvailable: 1 }
#     networkPolicy: false        # true denies both directions, then allows
#                                 # only the peers named below
#     networkPolicyPeers:         # names, not selectors — the template owns the
#                                 # labels and ports each peer actually has
#       ingress: [gateway]        #   gateway     the Traefik pod, traefik ns
#       egress:  [mariadb, redis] #   mariadb     data ns, 3306
#                                 #   redis       data ns, 6379
#                                 #   alloy       observability ns, OTLP 4317
#                                 #   dns         kube-dns, 53 — always added,
#                                 #               never write it here
#                                 #   svc:<name>  another service in this ns
#
#     A pair of services that call each other needs both halves: egress on the
#     caller and ingress on the callee. One direction alone leaves the caller
#     looking correctly configured while the destination drops the packet.
#
#     svc:<name> renders a bare podSelector, which a NetworkPolicy scopes to the
#     policy's own namespace. Naming a service that lives in a different one —
#     web against api — matches no pod and drops the call with a policy that
#     reads as correct. Those need a peer with a namespaceSelector instead.
