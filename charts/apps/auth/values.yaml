# auth

namespace: api

# Created by the platform-config release, mounted here by name.
sharedConfig:
  name: app-config

# Created by `make app-secrets`. Only the name is in git.
sharedSecret:
  name: app-secrets

services:
  auth:
    image:
      repository: auth
      tag: v0.1.0
      pullPolicy: Never           # local: kind load, no registry to pull from
    port: 9001
    replicas: 2
    workloadKind: Deployment
    uid: 10001                    # numeric — kubelet does not resolve names

    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }

    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }

    env:
      - { name: APP_PORT, value: "9001" }

    envFromSecret:                # names only, never values
      - mariadb-dsn
      - jwt-secret

    topologySpread: true
    pdb: { minAvailable: 1 }

    # In the mesh with the rest of api now that payment proved the
    # sidecar pattern. Edge traffic still arrives plaintext from Traefik, so the mesh
    # runs PERMISSIVE — STRICT would cut this service off from the gateway.
    mesh: true  # adds netpol istiod (egress) + alloy-scrape:15020 (ingress)

    networkPolicy: true
    networkPolicyPeers:
      # The browser calls /api/auth through the gateway itself, so the gateway
      # is a direct client here. Under option 1 (notes/06) the caller becomes
      # web-ui, which now sits in the web namespace — svc:web-ui would render a
      # bare podSelector scoped to api and match nothing, so that change needs a
      # peer carrying a namespaceSelector, not a rename.
      ingress: [gateway]
      egress: [mariadb, redis, alloy]
