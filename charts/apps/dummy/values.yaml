# dummy
#
# A minimal workload used to check that an image builds, loads into the cluster
# and gets scheduled. If something in the setup is broken, this fails first.
#
# It also has /chaos/error-rate and /chaos/latency, which change its behaviour
# at runtime. That is what makes it useful for testing canary rollback — a real
# service cannot be told to start failing on demand.

namespace: demo

# dummy has no ConfigMap and no Secret on purpose. It should not depend on
# anything else, or a failure here could mean the dependency is missing rather
# than the cluster being broken.

services:
  dummy:
    image:
      repository: dummy
      # Must match VERSION in the Makefile. If the tag here is one that
      # `make images` does not build, the pod fails with ErrImageNeverPull.
      tag: v0.1.0
      # kind load copies the image to every node and there is no registry,
      # so the kubelet must not try to pull.
      pullPolicy: Never
    port: 8080
    replicas: 2
    workloadKind: Deployment
    # Must be a number. The kubelet cannot read /etc/passwd inside the image,
    # so it cannot check whether a username maps to root, and refuses to start
    # the container. 65532 is the nonroot uid in distroless.
    uid: 65532
    # No startup delay — dummy is ready immediately. The library defaults are
    # for services that need time to start, so set these explicitly.
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 0, periodSeconds: 10 }
      readiness: { path: /readyz,  initialDelaySeconds: 0, periodSeconds: 5 }
    resources:
      requests: { cpu: 20m,  memory: 32Mi }
      limits:   { cpu: 200m, memory: 128Mi }
    env:
      - { name: PORT, value: "8080" }
    topologySpread: true
    pdb: { minAvailable: 1 }
    networkPolicy: false
