# payment-svc

namespace: api

sharedConfig:
  name: app-config

sharedSecret:
  name: app-secrets

services:
  payment-svc:
    image:
      repository: payment-svc
      tag: v0.1.0
      pullPolicy: Never
    port: 9003
    replicas: 2
    workloadKind: Deployment
    uid: 10001
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }
    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }
    env:
      # payment-svc reads PORT; its siblings read APP_PORT. Both are set rather
      # than editing Go source mid-migration — recorded as debt to fix at the
      # source, not papered over by pretending the service is consistent.
      - { name: PORT, value: "9003" }
      - { name: APP_PORT, value: "9003" }
      - { name: PAYMENT_GATEWAY_URL, value: http://payment-gateway.api.svc.cluster.local }
      - { name: ORDER_SVC_URL, value: http://order-svc.api.svc.cluster.local }
      # Required: the Go code panics at startup without it.
      - { name: NOTIFICATION_URL, value: http://notification.api.svc.cluster.local }
    envFromSecret:
      - mariadb-dsn
      - jwt-secret
    topologySpread: true
    pdb: { minAvailable: 1 }

    # The other half of the mTLS pair with payment-gateway: a sidecar on both ends
    # negotiates mTLS on that east-west hop even under PERMISSIVE, which is the
    # gap the mesh exists to close. Edge traffic stays plaintext to Traefik.
    mesh: true  # adds netpol istiod (egress) + alloy-scrape:15020 (ingress)

    networkPolicy: true
    networkPolicyPeers:
      # The other half of the order-svc cycle: order-svc starts a payment, this
      # service calls back to settle it.
      ingress: [gateway, svc:order-svc]
      # No redis: this service opens MariaDB only. auth-svc and order-svc are
      # the two that call db.OpenRedis.
      # svc:notification is easy to forget: the settle path now ends with a
      # best-effort notify, so without the rule the call is dropped and payment
      # still succeeds — the miss is silent.
      egress: [svc:order-svc, svc:payment-gateway, svc:notification, mariadb, alloy]
