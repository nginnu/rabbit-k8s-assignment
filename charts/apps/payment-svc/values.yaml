# payment-svc

namespace: demo

sharedConfig:
  name: app-config

sharedSecret:
  name: app-secrets

services:
  payment-svc:
    image:
      repository: payment-svc
      tag: v0.1.0
      pullPolicy: Never
    port: 9003
    replicas: 2
    workloadKind: Deployment
    uid: 10001
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }
    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }
    env:
      # payment-svc reads PORT; its siblings read APP_PORT. Both are set rather
      # than editing Go source mid-migration — recorded as debt to fix at the
      # source, not papered over by pretending the service is consistent.
      - { name: PORT, value: "9003" }
      - { name: APP_PORT, value: "9003" }
      - { name: MOCK_PAYMENT_URL, value: http://mock-payment.demo.svc.cluster.local }
      - { name: ORDER_SVC_URL, value: http://order-svc.demo.svc.cluster.local }
    envFromSecret:
      - mariadb-dsn
      - jwt-secret
    topologySpread: true
    pdb: { minAvailable: 1 }
    networkPolicy: false
