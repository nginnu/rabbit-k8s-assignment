# auth-svc

namespace: demo

# Created by the platform-config release, mounted here by name.
sharedConfig:
  name: app-config

# Created by `make app-secrets`. Only the name is in git.
sharedSecret:
  name: app-secrets

services:
  auth-svc:
    image:
      repository: auth-svc
      tag: v0.1.0
      pullPolicy: Never           # local: kind load, no registry to pull from
    port: 9001
    replicas: 2
    workloadKind: Deployment
    uid: 10001                    # numeric — kubelet does not resolve names

    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }

    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }

    env:
      - { name: APP_PORT, value: "9001" }

    envFromSecret:                # names only, never values
      - mariadb-dsn
      - jwt-secret

    topologySpread: true
    pdb: { minAvailable: 1 }

    # Declared but not enforced — enabling is done one service at a time so a
    # dropped flow is traceable to the release that dropped it.
    networkPolicy: false
    networkPolicyPeers:
      # The browser calls /api/auth through the gateway itself, so the gateway
      # is a direct client here. Under option 1 (notes/06) this becomes web-ui.
      ingress: [gateway]
      egress: [mariadb, redis, alloy]
