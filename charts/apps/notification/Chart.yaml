apiVersion: v2
name: notification
description: |
  Notification service: order calls POST /notify here when a payment
  settles. /notify-failed deliberately fails, so a failure can be simulated on
  demand and then seen in Loki; the /chaos endpoints are kept so a canary can
  still be told to fail on demand.

  One chart, one release. The templates come from the platform-service library
  chart; this chart contributes values only, so a service can be upgraded or
  rolled back without touching anything deployed beside it.
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: platform-service
    version: 0.1.0
    repository: "file://../../platform-service"
