# web-ui

namespace: demo

# No sharedConfig and no sharedSecret. app-config carries backend concerns —
# collector endpoint, Redis address — that a browser-facing frontend never
# reads, and the storefront holds no database credentials or signing key: it
# calls the APIs through the gateway carrying the user's own JWT.

services:
  web-ui:
    image:
      repository: web-ui
      tag: v0.1.0
      pullPolicy: Never
    port: 3000
    replicas: 2
    workloadKind: Deployment
    # 1001, not the 10001 the Go services use: web-ui's Dockerfile creates the
    # nextjs user with --uid 1001, and a runAsUser the image has no account for
    # leaves the pod unable to start.
    uid: 1001
    # Next.js writes its server-side cache under .next at run time, so the root
    # filesystem cannot be read-only here. The Go services keep it read-only —
    # this is a property of the runtime, not a relaxed standard.
    readOnlyRootFilesystem: false
    # Probes hit / rather than /healthz: Next.js serves no health endpoint, and
    # a probe pointed at one that does not exist fails the pod on a route that
    # was never implemented.
    probes:
      liveness:  { path: /, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /, initialDelaySeconds: 5,  periodSeconds: 5 }
    resources:
      requests: { cpu: 50m,  memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    env:
      - { name: PORT, value: "3000" }
      # Next.js standalone binds localhost unless told otherwise, which makes
      # the container reachable from nothing outside itself — the readiness
      # probe fails and the Service has no endpoints.
      - { name: HOSTNAME, value: "0.0.0.0" }
    topologySpread: true
    pdb: { minAvailable: 1 }

    networkPolicy: false
    networkPolicyPeers:
      ingress: [gateway]
      # No backend egress: lib/api.ts runs in the browser, so the calls to
      # auth/order/payment leave the user's machine, not this pod. Option 1
      # moves them server-side and this list grows to the three services.
      egress: [alloy]
