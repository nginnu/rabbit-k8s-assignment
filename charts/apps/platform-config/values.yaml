# platform-config — the environment every service reads
#
# PLATFORM values, all of them. An app team that needs a value of its own puts
# it in `env` on its own service; anything here changes six services at once,
# which is exactly why it is not theirs to set.
#
# Changing a key here restarts every service that mounts the ConfigMap. That is
# correct — a value they all read changed — but it is the reason to keep this
# file small and put per-service settings in the service's own chart.

# api. A ConfigMap is only mountable from its own namespace, and every service
# that names app-config in sharedConfig lives here — web-ui declares none, so
# nothing in web is left waiting on a ConfigMap that was never created there.
namespace: api

sharedConfig:
  name: app-config
  data:
    DEPLOYMENT_ENV: local
    SVC_PREFIX: platform
    # Labels telemetry, not the image. Every dashboard and SLO query groups by
    # it, so raising it moves a dimension rather than describing a release.
    SVC_VERSION: v0.1.0
    REDIS_ADDR: redis.data.svc.cluster.local:6379
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc

# No services block: this release renders a ConfigMap and nothing else.
services: {}
