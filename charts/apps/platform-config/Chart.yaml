apiVersion: v2
name: platform-config
description: |
  Configuration every service shares — the ConfigMap they all mount.

  It is its own release because it is nobody's service. Owned by one of the
  application charts, that chart could not be removed without breaking the
  others; owned by all of them, six releases would fight over the same object
  on every sync. A separate release syncs ahead of them (wave 10) and leaves
  the six application charts genuinely independent of each other.
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: platform-service
    version: 0.1.0
    repository: "file://../../platform-service"
