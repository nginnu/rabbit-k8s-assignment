# order-svc

namespace: api

sharedConfig:
  name: app-config

sharedSecret:
  name: app-secrets

services:
  order-svc:
    image:
      repository: order-svc
      tag: v0.1.0
      pullPolicy: Never
    port: 9002
    replicas: 2
    workloadKind: Rollout
    uid: 10001
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }
    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }
    env:
      - { name: APP_PORT, value: "9002" }
      # No PAYMENT_SVC_URL: order-svc opens no outbound HTTP at all — payment-svc
      # calls it, not the other way round. Left set, it read as a live dependency
      # and the next person to trace the call graph would look for a caller that
      # does not exist.
      # Fraction of business requests answered with 500. 0 is off; raise it to
      # deploy a build that passes /healthz but serves errors, which is what a
      # canary has to catch and a crashing pod does not.
      - { name: FAIL_RATE, value: "0" }
    envFromSecret:
      - mariadb-dsn
      - jwt-secret
    topologySpread: true
    pdb: { minAvailable: 1 }

    # Meshed like its siblings. The label lands on spec.template, which a
    # Rollout shares with a Deployment, so the canary pods get sidecars too —
    # and the traffic split stays pod-count-based: adding a VirtualService here
    # would be the mesh taking routing Argo Rollouts already owns.
    mesh: true  # adds netpol istiod (egress) + alloy-scrape:15020 (ingress)

    networkPolicy: true
    networkPolicyPeers:
      # payment-svc calls back here to settle an order, so it is a client as
      # well as a destination. Both halves of that cycle have to be written or
      # the callback is dropped at whichever side is missing.
      ingress: [gateway, svc:payment-svc]
      # No redis since the catalog split: the product cache-aside that used
      # it moved to catalog, and nothing else here caches. No payment-svc
      # either — the cycle above is one-way at the connection level, and a
      # NetworkPolicy is connection-tracked, so payment-svc's replies come back
      # on the ingress rule and need no egress of their own.
      egress: [mariadb, alloy]

    rollout:
      strategy:
        canary:
          # 50 because traffic splits by pod count — no Istio routing here, so
          # at replicas: 2 nothing smaller can actually be produced.
          steps:
            - setWeight: 50
            - analysis:
                templates:
                  - templateName: order-svc-success-rate
            - setWeight: 100

      analysis:
        address: http://prometheus-server.observability.svc.cluster.local
        metrics:
          - name: success-rate
            # Metrics arrive by push every 10s, not by scrape. A shorter
            # interval reads a rate() the canary has not exported into yet.
            interval: 30s
            count: 4
            # The pod is ready before its first export exists; without this the
            # first measurement grades the old pods.
            initialDelay: 30s
            # No traffic returns NaN (0/0) or an empty vector, and an empty one
            # throws inside expr and scores as a provider Error rather than a
            # failure. Both guards make it a plain failed measurement instead,
            # so a canary nobody exercised is never promoted.
            successCondition: len(result) > 0 && !isNaN(result[0]) && result[0] >= 0.95
            failureLimit: 1
            # Argo defaults to 4 — two minutes of unreachable Prometheus while
            # the release keeps advancing.
            consecutiveErrorLimit: 2
            # sum with no `by` collapses old and new pods together: without
            # Istio there is no canary-only label to split on.
            query: |
              sum(rate(http_server_request_duration_seconds_count{
                service="order-svc",
                http_response_status_code!~"5.."
              }[2m]))
              /
              sum(rate(http_server_request_duration_seconds_count{
                service="order-svc"
              }[2m]))
