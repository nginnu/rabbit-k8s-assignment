# Environments are separated by cluster, not by namespace prefix, so nothing
# here carries "local" or "dev" in its name.
#
# web and api are split rather than one application namespace because a
# NetworkPolicy peer written as a bare podSelector only ever matches inside its
# own namespace. With the frontend and the services together, "the storefront
# may not reach MariaDB" cannot be expressed without naming pods; apart, it is
# the default.
apiVersion: v1
kind: Namespace
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: platform
