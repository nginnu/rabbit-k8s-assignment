# grafana/loki
#
# SingleBinary. The chart defaults to SimpleScalable, which wants object storage
# and refuses to render without bucket names.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    # Required for the log shape Alloy pushes from OTLP. Without it the writes
    # are rejected and the logs simply never appear.
    allow_structured_metadata: true
    volume_enabled: true

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # persistence.enabled false leaves nothing mounted at /var/loki, and Loki
  # exits with "mkdir /var/loki: read-only file system" because the root
  # filesystem is read-only. An emptyDir is enough — telemetry is regenerated by
  # re-running traffic and does not need to outlive the pod.
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# The other deployment modes and the extras that come with them.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
