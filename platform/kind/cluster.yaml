apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# No name here: kind takes it from --name, which the Makefile passes. A name in
# this file overrides the flag and `make up CLUSTER=other` silently has no
# effect.

networking:
  disableDefaultCNI: false
  kubeProxyMode: iptables

# Multi-node because PodDisruptionBudget and topology spread mean nothing on
# one node — the second replica stays Pending and a drain never succeeds.
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Marks this node as the ingress host so the gateway can be pinned here,
      # where the port mappings below actually exist.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
  - role: worker
  - role: worker
  