pilot:
  # The chart asks for 500m CPU / 2Gi memory by default, sized for a real
  # cluster. Three kind nodes share one laptop, and a request that large lands
  # istiod in Pending with "Insufficient memory" long after the install reports
  # success.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # The chart's default is an HPA. Nothing in this cluster installs
  # metrics-server, so that HPA sits permanently unable to read a metric and
  # reports it as a failing target in every describe — noise that looks like a
  # broken control plane.
  autoscaleEnabled: false

meshConfig:
  # Without this the proxy logs nothing about the requests it forwards, and the
  # first question after injection — "did the request even reach the sidecar" —
  # has no answer anywhere.
  accessLogFile: /dev/stdout

global:
  proxy:
    # Inert until a namespace is labelled, set now because the default is
    # 100m/128Mi requested per sidecar: six services would reserve 600m of CPU
    # before a single request is served, on nodes that already run Cilium,
    # Traefik and the LGTM stack.
    resources:
      requests:
        cpu: 30m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 256Mi
