# Values for the istiod chart, sized for a local cluster.

pilot:
  # Three Docker containers share this machine — small, but not so small that
  # istiod gets OOM-killed.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaleEnabled: false

meshConfig:
  # Access logs to stdout — the quickest way to see which route a request took.
  accessLogFile: /dev/stdout
  defaultConfig:
    proxyMetadata: {}

# Sidecar injection is off; namespaces opt in with a label. Ingress only, so a
# broken request has one place to look instead of two.
