# Kiali server values, sized and wired for this cluster.
#
# Auth is anonymous on purpose, for now: a lab cluster on a laptop, where a
# token dance buys no security that the machine's own login does not already
# provide. Revisit alongside the STRICT phase, when the mesh starts refusing
# things and the console becomes worth locking.

auth:
  strategy: anonymous

istio_namespace: istio-system

deployment:
  # Kind runs three nodes on one machine; the chart's defaults are sized for
  # a real cluster and land Kiali competing with the LGTM stack for memory.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ClusterIP stays: the console is reached through the Traefik Gateway on
  # its own host, the same shape as Grafana — never a second edge of its own.
  service_type: ClusterIP
  # Off, and the reason is ownership not preference: this repo writes the
  # tier's policies itself, in
  # platform/manifests/addons/observability/netpol.yaml, applied by
  # `make observability` before this chart installs — so the pod is born
  # isolated with the peers this platform actually has (gateway in on 20001;
  # prometheus, grafana, dns and the API server out). The chart ships its own
  # policy under the same object name, and helm refuses to install over an
  # object another hand created — the collision is how this key was found.
  network_policy:
    enabled: false

server:
  # Served at the root of its own host (kiali.localhost), so no web_root
  # prefix and no path rewriting anywhere on the route.
  web_root: /

external_services:
  prometheus:
    # The same server Argo's canary analysis reads — one source of numbers
    # for health, whoever asks.
    url: http://prometheus-server.observability.svc.cluster.local
  grafana:
    # Two URLs, two audiences: internal_url is what the Kiali pod itself
    # probes, external_url is the link it prints into the browser, which
    # leaves the cluster through the gateway like every other console here.
    # external_url/internal_url are the 2.30 names — url/in_cluster_url log
    # a deprecation notice on every boot.
    external_url: https://grafana.localhost
    internal_url: http://grafana.observability.svc.cluster.local
  tracing:
    # Off for this phase: metrics and the graph first. Tempo speaks the
    # Jaeger query API, so wiring it in later is values-only — but it is its
    # own verification, not a free checkbox.
    enabled: false
