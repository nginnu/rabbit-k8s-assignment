# argo/argo-cd
#
# Served at argocd.localhost through the same gateway as everything else, so
# reaching it is not a port-forward someone has to remember to run.
#
# No server.rootpath / server.basehref: both exist only for a reverse proxy
# serving Argo CD under a subpath, and on its own host the request already
# arrives at /. Setting either would move the UI to /argocd while the route
# still forwards /, so index.html renders and every asset behind it 404s.

configs:
  params:
    # The gateway terminates TLS. Left at the default the server also serves
    # TLS, so the gateway would open a plaintext connection to a TLS listener
    # and every request fails before it reaches Argo CD.
    #
    # "Run server without TLS" — argocd-cmd-params-cm.yaml
    server.insecure: true

  cm:
    # What the UI puts in generated links and callback URLs. Naming the wrong
    # host sends a login redirect to the storefront instead of back here.
    url: https://argocd.localhost

# Single node kind cluster running a whole shop alongside this. HA would add a
# redis-ha quorum and three controller replicas for no benefit on a laptop.
redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

server:
  replicas: 1

# No SSO on a laptop; dex is an idle pod and a second thing to wait on.
dex:
  enabled: false

# On by default. Nothing here has a notification service configured, so it is a
# pod doing nothing.
notifications:
  enabled: false
