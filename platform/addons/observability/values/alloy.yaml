# grafana/alloy
#
# The collector every service points at. Receives OTLP, splits the three signals
# to Loki, Tempo and Prometheus.
#
# A Deployment, not the chart's default DaemonSet: this receives pushed
# telemetry rather than scraping each node.

controller:
  type: deployment
  replicas: 1

alloy:
  # The applications send OTLP here; nothing else needs to reach Alloy.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

  configMap:
    content: |-
      // OTLP in, three signals out.
      //
      //   receiver :4317 / :4318
      //     -> filter   drop /healthz spans
      //     -> transform  derive deployment_environment and service
      //          -> Loki (logs) / Tempo (traces) / Prometheus (metrics)

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          metrics = [otelcol.processor.transform.add_labels.input]
          logs    = [otelcol.processor.transform.add_labels.input]
          traces  = [otelcol.processor.filter.drop_healthz.input]
        }
      }

      // Health checks would otherwise be most of the traces: every 10s across
      // six services. Three attribute names because the semconv changed.
      otelcol.processor.filter "drop_healthz" {
        error_mode = "ignore"

        traces {
          span = [
            "attributes[\"http.route\"] == \"/healthz\"",
            "attributes[\"http.target\"] == \"/healthz\"",
            "attributes[\"url.path\"] == \"/healthz\"",
          ]
        }

        output {
          traces = [otelcol.processor.transform.add_labels.input]
        }
      }

      // service.name arrives as platform-local-auth-svc. Split it into
      // deployment_environment=local and service=auth-svc, which is what every
      // dashboard and the Tempo-to-Loki link query by.
      //
      // The services deliberately do not send deployment.environment themselves
      // — deriving it here keeps one source for the label.
      otelcol.processor.transform "add_labels" {
        error_mode = "ignore"

        metric_statements {
          context    = "resource"
          statements = [
            "set(attributes[\"deployment_environment\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"deployment_environment\"], \"^platform-(local|qa|dev|prod)-.+$\", \"$1\") where attributes[\"deployment_environment\"] != nil",
            "set(attributes[\"service\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"service\"], \"^platform-(local|qa|dev|prod)-\", \"\") where attributes[\"service\"] != nil",
          ]
        }

        log_statements {
          context    = "resource"
          statements = [
            "set(attributes[\"deployment_environment\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"deployment_environment\"], \"^platform-(local|qa|dev|prod)-.+$\", \"$1\") where attributes[\"deployment_environment\"] != nil",
            "set(attributes[\"service\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"service\"], \"^platform-(local|qa|dev|prod)-\", \"\") where attributes[\"service\"] != nil",
          ]
        }

        trace_statements {
          context    = "resource"
          statements = [
            "set(attributes[\"deployment_environment\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"deployment_environment\"], \"^platform-(local|qa|dev|prod)-.+$\", \"$1\") where attributes[\"deployment_environment\"] != nil",
            "set(attributes[\"service\"], attributes[\"service.name\"]) where IsMatch(attributes[\"service.name\"], \"^platform-(local|qa|dev|prod)-.+\")",
            "replace_pattern(attributes[\"service\"], \"^platform-(local|qa|dev|prod)-\", \"\") where attributes[\"service\"] != nil",
          ]
        }

        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          logs    = [otelcol.exporter.loki.default.input]
          traces  = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint = "http://tempo.observability.svc.cluster.local:4318"
          tls {
            insecure = true
          }
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
        add_metric_suffixes = true
        // Turns the resource attributes above into actual Prometheus labels.
        // Without it `service` never exists and every dashboard panel is blank.
        resource_to_telemetry_conversion = true
      }

      // The chart names the service prometheus-server and puts it on port 80,
      // not prometheus:9090.
      prometheus.remote_write "default" {
        endpoint {
          url = "http://prometheus-server.observability.svc.cluster.local:80/api/v1/write"
        }
      }
