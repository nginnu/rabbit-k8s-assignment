# Grafana at /grafana.
#
# The gateway strips the prefix before forwarding, so Grafana serves at / and
# only its root_url carries /grafana. Setting serve_from_sub_path as well would
# make every generated link /grafana/grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: platform
      namespace: istio-system
  rules:
    - matches:
        - path: { type: PathPrefix, value: /grafana }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        # The chart puts Grafana on port 80, not 3000.
        - name: grafana
          port: 80
