# TLS for the gateway. The Issuer says who signs, the Certificate says what to
# sign; only the Issuer changes on a real domain (ca -> acme).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mkcert-ca
spec:
  ca:
    # Written by `make tls` from `mkcert -CAROOT`. The private key stays on this
    # machine and in the Secret; it is never committed.
    secretName: mkcert-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-tls
  # Istio reads the certificate from a Secret in its own namespace, so it has to
  # be issued into istio-system.
  namespace: istio-system
spec:
  secretName: platform-tls
  dnsNames:
    - localhost
  # So a request that bypasses name resolution validates too, rather than
  # failing on a SAN mismatch.
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: mkcert-ca
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
