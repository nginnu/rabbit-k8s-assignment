# A backendRef is namespace-local, so each route sits in the namespace of the
# Service it names. Cross-namespace needs a ReferenceGrant beside it, and
# without one the route attaches and answers 500 while the Gateway still
# reports Accepted.
#
# /api is stripped before forwarding, so backends keep the paths they serve and
# the UI stays on one origin. The longest matching prefix wins, so these rules
# and the web-ui catch-all coexist across the two namespaces.
#
# hostnames confines these rules to the storefront origin. Traefik ranks routers
# by path length and gives the host almost no weight, so without it /api/auth
# outranks Host("kiali.localhost") && PathPrefix("/") and the console's own
# /api/auth/info call is answered by auth-svc — Kiali hangs on Loading. Gateway
# API ranks matching hostname characters first and path only as the tie-break;
# this line is for Traefik's ranking, not the spec's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: api
spec:
  hostnames:
    - localhost
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/auth }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /auth }
      backendRefs:
        - name: auth-svc
          port: 80

    - matches:
        - path: { type: PathPrefix, value: /api/products }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /products }
      backendRefs:
        - name: order-svc
          port: 80

    - matches:
        - path: { type: PathPrefix, value: /api/orders }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /orders }
      backendRefs:
        - name: order-svc
          port: 80

    - matches:
        - path: { type: PathPrefix, value: /api/payments }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /payments }
      backendRefs:
        - name: payment-svc
          port: 80
---
# notification has its own route so a canary can be exercised against a service
# that holds no data and can be told to fail on demand; it also exposes
# /notify-failed for manual failure simulation from outside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notification
  namespace: api
spec:
  hostnames:
    - localhost
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: /notification }
      filters:
        - type: URLRewrite
          urlRewrite:
            # An empty replacement strips the prefix; the /api rules above
            # rewrite to a non-empty one. notification registers exact top-level
            # paths (/notify, /notifications, /notify-failed), so without the
            # strip /notification/notify-failed matches no handler and 404s. The
            # old dummy route needed no rewrite only because GET / was a
            # catch-all.
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: notification
          port: 80
