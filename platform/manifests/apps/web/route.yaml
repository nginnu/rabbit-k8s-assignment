# Routing.
#
# HTTPRoutes live in the app namespace beside the service they expose: platform
# owns the Gateway, app teams own their routes.
#
# The most specific prefix wins, so / must be last.
#
# The three routes now sit in two namespaces, which does not change that: the
# spec ranks matches by the number of characters in the path first, and only
# falls back to creation time and namespace/name when two matches tie. /api/auth
# beats / wherever each route lives. A backendRef, though, is namespace-local —
# each route has to be in the namespace of the Service it names or the ref needs
# a ReferenceGrant beside it, and without one the route attaches and answers 500
# with the Gateway still reporting Accepted.
#
# Everything else is the UI. A separate route so a frontend canary can shift
# weights without touching backend routing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-ui
  namespace: web
spec:
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web-ui
          port: 80
