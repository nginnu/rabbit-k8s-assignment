# A backendRef is namespace-local, so this route sits in the namespace of the
# Service it names. Cross-namespace needs a ReferenceGrant beside it, and
# without one the route attaches and answers 500 while the Gateway still
# reports Accepted.
#
# A route of its own, rather than a rule inside the api route, so a frontend
# canary can shift weights without touching backend routing.
#
# hostnames confines that catch-all to the storefront origin. Traefik ranks
# routers by path length and gives the host almost no weight, so without it this
# / attaches to every console host on the Gateway — grafana, argocd, kiali,
# hubble — and competes with the route each of them owns. Gateway API ranks
# matching hostname characters first and path only as the tie-break; this line
# is for Traefik's ranking, not the spec's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-ui
  namespace: web
spec:
  hostnames:
    - localhost
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web-ui
          port: 80
