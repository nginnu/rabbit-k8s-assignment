# The observability namespace and the one Service the upstream charts do not
# create for us.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: platform
---
# otel-collector is the address every service already points at through
# app-config. The Alloy chart names its Service after the release, so this alias
# selects the same pods under the name the applications expect.
#
# Without it the services still run — the OTel SDK logs "produced zero
# addresses" and keeps serving — but nothing is recorded, which is the harder
# failure to notice.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
