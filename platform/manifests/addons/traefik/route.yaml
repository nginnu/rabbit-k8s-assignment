apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  # A backendRef in another namespace causes 500.
  namespace: traefik
spec:
  # Own host. The rule below matches at /, which on the shared localhost origin
  # would swallow every storefront path the app routes own.
  hostnames:
    - traefik.localhost
  parentRefs:
    - name: platform
      namespace: traefik
      # Without this the route also attaches to `web` and the dashboard is
      # served in plaintext on :80.
      sectionName: websecure
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      # Traefik answers only on /dashboard/. Without the rewrite the request
      # arrives under a name it does not know and returns 404.
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /dashboard }
      backendRefs:
        - name: traefik
          port: 8080
    # Not rewritten: the dashboard calls /api/overview and /api/http/routers as
    # absolute paths. A longer prefix outranks the / above, so these keep
    # reaching the admin API instead of being rewritten under /dashboard.
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: traefik
          port: 8080
