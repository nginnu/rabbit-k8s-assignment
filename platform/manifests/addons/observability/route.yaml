# Nothing rewrites the path any more, so root_url in values/grafana.yaml must
# name this host — pointed at the storefront origin instead, every generated
# link walks the browser out of Grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  # Own host. Matching / on the shared localhost origin would take the
  # storefront's paths with it.
  hostnames:
    - grafana.localhost
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # The chart puts Grafana on port 80, not 3000.
        - name: grafana
          port: 80
