apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  # Beside the Service it names: a cross-namespace backendRef answers 500
  # without a ReferenceGrant, and kube-system belongs to the cilium release.
  namespace: kube-system
spec:
  # Own host. Matching / on the shared localhost origin would take the
  # storefront's paths with it.
  hostnames:
    - hubble.localhost
  parentRefs:
    - name: platform
      namespace: traefik
      # HTTPS only. Hubble UI has no login and renders the full call topology,
      # readable over plaintext from the host network on the `web` listener.
      sectionName: websecure
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # The chart puts the UI on port 80, targeting the frontend container's
        # 8081 — not the backend's 8090, which speaks gRPC-Web to relay and
        # serves no HTML. `hubble.ui.baseUrl` stays "/" upstream, so there is
        # nothing to rewrite here.
        - name: hubble-ui
          port: 80
