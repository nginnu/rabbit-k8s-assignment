# Argo CD Applications.
#
# This file is the bootstrap seam and the one thing here that is not itself
# under GitOps: something has to apply the first Application before Argo CD is
# managing anything. `make gitops-bootstrap` applies it — `make argocd` stops
# at namespace.yaml and route.yaml — and from then on the loop runs without
# make.
#
# That target runs after `make apps`, never before. Applied first, Argo CD
# creates notification's objects itself and the later
# `helm upgrade --install notification` aborts: NetworkPolicy "notification" in
# api exists without the app.kubernetes.io/managed-by=Helm label and cannot be
# imported.
#
# notification only, on purpose. order does depend on this workload now,
# but its notify call is best-effort with a 3s timeout, so a sync that goes
# wrong degrades notification delivery, never payment completion — the blast
# radius is contained by the caller's design, not by being uncalled. The other
# five stay with helm until this one has proven the loop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification
  # Applications are only read by the controller when they live in the
  # namespace it watches. In another namespace the object is accepted and then
  # ignored, with no event to say why.
  namespace: argocd
  # Without this the Application object is deleted immediately while the
  # Deployment, Service and PDB it created stay behind with nothing owning
  # them — they would then have to be found and removed by hand.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/nginnu/rabbit-k8s-assignment.git
    path: charts/apps/notification
    # A branch, not a tag or a SHA: the point being proved is that a commit to
    # main reaches the cluster on its own.
    targetRevision: main
    helm:
      # The release name Helm used. It feeds the app.kubernetes.io/instance
      # label in the rendered output, so leaving it to default to the
      # Application name happens to match here — set explicitly so a rename of
      # the Application does not silently relabel every object.
      releaseName: notification

  destination:
    # The literal string for the cluster Argo CD runs in. Naming it in-cluster
    # instead only works when a cluster Secret declares that name, and there is
    # none here.
    server: https://kubernetes.default.svc
    # Must agree with `namespace:` in charts/apps/notification/values.yaml. The chart
    # writes metadata.namespace on every object it renders, and an explicit
    # namespace wins over the destination — set them apart and Argo CD syncs
    # into api while reporting the Application as targeting somewhere else.
    namespace: api

  syncPolicy:
    automated:
      # On. notification's objects are fully described by the chart, so anything
      # in the cluster that the chart no longer renders is a leftover. Off, a
      # removed template would keep running forever and the cluster would drift
      # from git in the direction git cannot see.
      prune: true
      # On. A kubectl edit against notification is reverted at the next
      # reconcile, which is the property being proved. It is safe here because
      # nothing else writes to these objects — notification has no HPA and is
      # not a Rollout, so there is no second controller whose changes would be
      # fought.
      selfHeal: true
    syncOptions:
      # api already exists from apps/api/namespace.yaml. Left unset Argo CD
      # would not create it anyway; stated so that a fresh cluster fails on the
      # missing namespace rather than creating an unlabelled one that
      # apps/api/namespace.yaml then disagrees with — and an unlabelled
      # namespace is not a cosmetic difference now: local/data/netpol.yaml and
      # addons/observability/netpol.yaml select app traffic by
      # kubernetes.io/metadata.name, which the API server sets, but the
      # part-of label apps/api/namespace.yaml carries is what marks it as ours.
      - CreateNamespace=false
      # Takes over the objects helm installed. They carry meta.helm.sh
      # annotations from the release created by `make apps`; without this the
      # first sync fails on every one of them as already existing and owned by
      # something else.
      - ServerSideApply=true
