# No rewrite and no rootpath/basehref on the server side: both sides serve at
# the root now, and reintroducing either alone leaves index.html pointing assets
# at a prefix the other half does not answer on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  # Own host. Matching / on the shared localhost origin would take the
  # storefront's paths with it.
  hostnames:
    - argocd.localhost
  parentRefs:
    - name: platform
      namespace: traefik
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # Port 80 and 443 both target container 8080. With server.insecure the
        # server speaks plaintext there, so 443 would be the gateway opening a
        # TLS connection to a listener that is not serving TLS.
        - name: argocd-server
          port: 80
