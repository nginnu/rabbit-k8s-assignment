# The entry point. Istio creates the Envoy deployment and Service from the
# Gateway object below — there is no separate ingress controller.
#
# This ConfigMap pins Envoy to the node where kind mapped host ports 80/443 and
# binds those ports. On a cloud cluster the Service is a LoadBalancer and none
# of it is needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-gateway-options
  namespace: istio-system
data:
  deployment: |
    spec:
      template:
        spec:
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: istio-proxy
              ports:
                - containerPort: 80
                  hostPort: 80
                - containerPort: 443
                  hostPort: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  # Istio below the pinned version ignores parametersRef and logs nothing: the
  # nodeSelector and hostPorts above vanish and :80 stops answering.
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: platform-gateway-options
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Port 80 stays open rather than redirecting, so the plaintext path is still
    # there to compare against in tests/tls-proof.sh.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: platform-tls
      allowedRoutes:
        namespaces:
          from: All
