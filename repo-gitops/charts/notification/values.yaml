# notification
#
# Receives order's POST /notify when a payment settles, and lists what it
# received on GET /notifications. POST /notify-failed deliberately fails, so a
# failure can be simulated on demand and then seen in Loki.
#
# The /chaos/error-rate and /chaos/latency endpoints are kept: a canary still
# needs a workload that can be told to start failing on demand. Nothing routes
# to this service from the gateway any more — those endpoints change a running
# workload's behaviour and were answering unauthenticated on the storefront's
# public listener — so every one of these paths is reached in-cluster, by the
# caller or by a kubectl exec.

# api, not a namespace of its own: notification is a backend workload that only
# order calls, over ClusterIP, from this same namespace — a third
# namespace would need its own copy of every cross-namespace allow rule to prove
# the same thing.
namespace: api

# The same ConfigMap its callers read. Inlining these five values instead kept
# the chart standalone, but it put the collector endpoint in two files, and the
# copy that drifts loses telemetry silently — the pod stays healthy and simply
# exports nowhere. Mounting it costs an ordering rule: app-config comes from the
# platform-config helm release, so a notification synced into a cluster that
# never ran `make apps` sits in CreateContainerConfigError. `make up` installs
# platform-config before gitops-bootstrap hands this chart to Argo CD, which is
# what makes that ordering hold.
sharedConfig:
  name: app-config

# No sharedSecret: notification holds no data and authenticates nothing, so
# there is no key for it to read.

services:
  notification:
    image:
      repository: notification
      # Must match VERSION in the Makefile. If the tag here is one that
      # `make images` does not build, the pod fails with ErrImageNeverPull.
      tag: v0.1.0
      # kind load copies the image to every node and there is no registry,
      # so the kubelet must not try to pull.
      pullPolicy: Never
    port: 8080
    replicas: 5
    workloadKind: Deployment
    # Must be a number. The kubelet cannot read /etc/passwd inside the image,
    # so it cannot check whether a username maps to root, and refuses to start
    # the container. 65532 is the nonroot uid in distroless.
    uid: 65532
    # No startup delay — notification is ready immediately. The library defaults
    # are for services that need time to start, so set these explicitly.
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 0, periodSeconds: 10 }
      readiness: { path: /readyz,  initialDelaySeconds: 0, periodSeconds: 5 }
    resources:
      requests: { cpu: 20m,  memory: 32Mi }
      limits:   { cpu: 200m, memory: 128Mi }
    env:
      # PORT stays here: it is this workload's own, and every service that reads
      # app-config listens on a different port. DEPLOYMENT_ENV,
      # SVC_PREFIX, SVC_VERSION and the two OTEL_ keys now arrive from the
      # mounted ConfigMap — main.go reads them with plain os.Getenv and panics
      # at start if DEPLOYMENT_ENV or the endpoint is missing, so a ConfigMap
      # short of a key fails the pod rather than running it blind.
      - { name: PORT, value: "8080" }
    topologySpread: true
    pdb: { minAvailable: 1 }

    # Same mesh opt-in as its siblings, with one caveat: this chart is synced
    # by Argo CD from main, not by `make apps`, so the sidecar arrives only
    # after the commit is pushed and Argo syncs — until then notification runs
    # 1/1 and tests/istio.sh warns instead of failing on it.
    mesh: true  # adds netpol istiod (egress) + alloy-scrape:15020 (ingress)

    networkPolicy: true
    networkPolicyPeers:
      # order must be here or its /notify call never arrives: the
      # namespace is default-deny, and the checkout still succeeds without the
      # notification — the call is best-effort, so a dropped packet fails
      # silently and nothing in the logs says the rule is missing.
      #
      # No gateway peer: the HTTPRoute is gone, so an allow from traefik would
      # open a path nothing routes — and the next reader would take it as
      # evidence that this service is meant to be reachable from the edge.
      ingress: [svc:order]
      # egress: [alloy] now carries the OTLP push, not just future-proofing: the
      # `alloy` peer in _networkpolicy.tpl opens TCP 4317, the OTLP/gRPC port.
      egress: []
