# catalog
#
# The product list. Split out of order: browsing is the storefront's
# hottest read and has nothing to do with the order lifecycle, so it gets its
# own scaling and its own failures.

namespace: api

sharedConfig:
  name: app-config

sharedSecret:
  name: app-secrets

services:
  catalog:
    image:
      repository: catalog
      tag: v0.1.0
      pullPolicy: Never
    port: 9004
    replicas: 2
    workloadKind: Deployment
    uid: 10001
    probes:
      liveness:  { path: /healthz, initialDelaySeconds: 10, periodSeconds: 15 }
      readiness: { path: /healthz, initialDelaySeconds: 5,  periodSeconds: 5 }
    resources:
      requests: { cpu: 50m,  memory: 96Mi }
      limits:   { cpu: 500m, memory: 384Mi }
    env:
      - { name: APP_PORT, value: "9004" }
    envFromSecret:
      - mariadb-dsn
      - jwt-secret
    topologySpread: true
    pdb: { minAvailable: 1 }

    # Meshed with the rest of api. The service-to-service hop through the
    # sidecar is web-ui's BFF calling from the web namespace; the edge leg
    # it replaced no longer exists.
    mesh: true  # adds netpol istiod (egress) + alloy-scrape:15020 (ingress)

    networkPolicy: true
    networkPolicyPeers:
      # The storefront's product grid arrives through web-ui's BFF from the
      # web namespace — the direct Traefik route is gone.
      ingress: [svc:web/web-ui]
      # Redis carries the cache-aside in front of the products table — the
      # one thing this service is here to protect.
      egress: [mariadb, redis]
