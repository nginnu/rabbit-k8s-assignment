apiVersion: v2
name: catalog
description: |
  Catalog service — the product list, split out of order so the browse
  path and the order path scale and fail independently. Read-only against
  the seeded products table, cache-aside in front of it.

  One chart, one release, one ArgoCD Application. The templates come from the
  platform-service library chart; this chart contributes values only, so a
  service can be rolled back or canaried without touching its siblings.
type: application
version: 0.1.0
appVersion: "0.4.0"

dependencies:
  - name: platform-service
    version: 0.1.0
    repository: "file://../_template"
